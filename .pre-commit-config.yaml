# Configuration file for pre-commit (https://pre-commit.com/).
# Please run `pre-commit run --all-files` when adding or changing entries.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10000"]
      - id: trailing-whitespace
      - id: check-json
      - id: check-merge-conflict
      - id: detect-aws-credentials
      - id: end-of-file-fixer
  # mypy runs from the uv workspace env so the lambdas' dependencies are importable, and
  # `template/` is checked separately because its `tests` package name collides with every
  # lambda's own `tests` package in a single invocation.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --all-packages mypy lambdas scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy-template
        name: mypy (template)
        entry: uv run --all-packages mypy template
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
